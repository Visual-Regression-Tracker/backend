name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prisma/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install prisma npm dependencies
        working-directory: prisma
        run: npm ci

      - name: Static analysis
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test:cov

  integration:
    name: integration (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e
            compose-file: docker-compose.yml
            test: npm run test:acceptance && npm run test:e2e
          - suite: ldap
            compose-file: docker-compose.yml:docker-compose.ldap.yml
            test: npm run test:ldap
          - suite: oidc
            compose-file: docker-compose.yml:docker-compose.oidc.yml
            test: npm run test:oidc
    env:
      COMPOSE_FILE: ${{ matrix.compose-file }}
      COMPOSE_PROJECT_NAME: vrt

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prisma/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vrt-api:latest
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api

      - name: Build migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: prisma
          load: true
          tags: vrt-migration:latest
          cache-from: type=gha,scope=ci-migration
          cache-to: type=gha,mode=max,scope=ci-migration

      - name: Run containers
        run: docker compose up --no-build -d

      - name: Wait for migrations and the api
        run: |
          status=$(docker wait vrt_migration)
          if [ "$status" != 0 ]; then
            echo "::error::migration container exited with $status"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --retry 30 --retry-delay 2 --retry-all-errors http://localhost:4200/health

      - name: Run ${{ matrix.suite }} tests
        run: ${{ matrix.test }}

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  test-migrations:
    # See: https://github.com/Visual-Regression-Tracker/backend/issues/273
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.3-alpine3.18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrt_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vrt_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vrt_migrations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prisma/package-lock.json

      - name: Install npm dependencies
        working-directory: prisma
        run: npm ci

      - name: Unit tests
        working-directory: prisma
        run: npm run test

      - name: Migrations match the schema
        working-directory: prisma
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema schema.prisma --exit-code

  test-dinov2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # the dinov2 image's Python
          python-version: '3.14'

      - name: Unit tests
        working-directory: dinov2
        run: |
          python3 -m venv .venv
          .venv/bin/pip install numpy==2.5.4
          .venv/bin/python -m unittest test_patches

  # branch protection requires a check named "build"
  build:
    if: ${{ !cancelled() }}
    needs: [checks, integration, test-migrations, test-dinov2]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
