name: Docker images

# Builds visualregressiontracker/api and visualregressiontracker/migration for
# linux/amd64 and linux/arm64 (Apple Silicon, Graviton), so docker compose runs
# them natively instead of under emulation.
# - pushing an api-vX.Y.Z or migration-vX.Y.Z tag publishes that image as X.Y.Z
# - "Run workflow" with an existing tag (re)publishes it, e.g. to add arm64 to a released version
# - pull requests that touch the images only build them, without pushing
# Publishing needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.

on:
  push:
    tags:
      - 'api-v*'
      - 'migration-v*'
  pull_request:
    branches: [master]
    paths:
      - Dockerfile
      - prisma/Dockerfile
      - prisma/schema.prisma
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. api-v5.7.0 or migration-v5.5.0
        required: true

# GITHUB_TOKEN is only used to check out the code; image pushes use the Docker Hub secrets
permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
          - image: migration
            context: prisma

    steps:
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PREFIX: ${{ matrix.image }}-v
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${TAG#"$PREFIX"}" != "$TAG" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#"$PREFIX"}" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG is not a ${{ matrix.image }} release, skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.version.outputs.build == 'true'
        with:
          # a manual run checks out the tag itself, never a branch with the same name
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # keep the token out of .git/config, which is part of the build context
          persist-credentials: false

      - name: Set up QEMU
        if: steps.version.outputs.build == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: steps.version.outputs.build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        if: steps.version.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: visualregressiontracker/${{ matrix.image }}:${{ steps.version.outputs.version || 'ci' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
