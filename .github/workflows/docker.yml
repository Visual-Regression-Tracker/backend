name: Docker images

on:
  push:
    tags:
      - 'api-v*'
      - 'migration-v*'
      - 'dinov2-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. api-v5.7.0, migration-v5.5.0 or dinov2-v1.0.0
        required: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
          - image: migration
            context: prisma
          - image: dinov2
            context: dinov2

    steps:
      - name: Resolve version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PREFIX: ${{ matrix.image }}-v
        run: |
          if [ "${TAG#"$PREFIX"}" != "$TAG" ]; then
            {
              echo "build=true"
              echo "push=true"
              echo "version=${TAG#"$PREFIX"}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG is not a ${{ matrix.image }} release, skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.version.outputs.build == 'true'
        with:
          # a manual run checks out the tag itself, never a branch with the same name
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set up QEMU
        if: steps.version.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.version.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: steps.version.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: visualregressiontracker/${{ matrix.image }}:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
