# https://docs.coderabbit.ai/getting-started/yaml-configuration
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!**/package-lock.json"
    - "!**/coverage/**"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"

chat:
  auto_reply: true
